[package]
name = "cashvec-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for CashVec"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_cashvec"
crate-type = ["cdylib"]

[dependencies]
cashvec = { path = ".." }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"
